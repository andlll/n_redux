<title>NIMBUS</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden;
               touch-action: none; overscroll-behavior: none; }
  #view { display: block; width: 100vw; height: 100vh; }
  /* Schermata di caricamento: sfondo nero pieno-schermo col logo Mount Fuji
     Software (tools/26_logo.py) centrato — [C] STUDIO.md §3, il flusso di
     room originale e' `loguji` (logo Fuji) -> `title` (il menu) -> ...: lo
     splash precede il MENU, non i livelli (game/play.html non ne ha piu'
     uno, segnalato dall'autore: "il logo compariva al caricamento dei
     livelli invece che del menu"). Il logo va in dissolvenza appena lo
     script parte (title.js aggiunge "show"); tutta l'overlay va in
     dissolvenza quando il caricamento asset e' completo e il primo frame e'
     stato disegnato (title.js aggiunge "hide") — vedi title.js, hideLoading(). */
  #loading { position: fixed; inset: 0; z-index: 10; background: #000;
             display: flex; align-items: center; justify-content: center;
             pointer-events: none; transition: opacity 0.6s ease; }
  #loading.hide { opacity: 0; }
  #loading img { width: min(45vw, 340px); height: auto; opacity: 0;
                 transition: opacity 0.8s ease; }
  #loading.show img { opacity: 1; }
</style>
<canvas id="view"></canvas>
<div id="loading"><img src="./assets/mount_logo.png" alt="Mount Fuji Software"></div>
<script type="module" src="./src/title.js"></script>
