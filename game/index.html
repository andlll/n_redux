<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Il gioco e' ancora in sviluppo attivo: il sito statico non deve
     "ricordarsi" una build precedente. Lo stato di gioco non persiste piu'
     da solo fra un caricamento e l'altro (game/src/main.js, seedChies()
     sempre), e questi header spingono anche il browser a non tenersi in
     cache l'HTML stesso invece di riservare la versione vecchia finche' la
     cache non scade da sola. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NIMBUS</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden;
               touch-action: none; overscroll-behavior: none; }
  #view { display: block; width: 100vw; height: 100vh; }
  /* Schermata di caricamento: sfondo nero pieno-schermo col logo Mount Fuji
     Software (tools/26_logo.py) centrato — STUDIO.md §3, il flusso di room
     originale e' `loguji` (logo Fuji) -> `title` (il menu) -> ...: lo splash
     precede il MENU, non i livelli. Il logo va in dissolvenza appena lo
     script parte (title.js aggiunge "show"); tutta l'overlay va in
     dissolvenza quando il caricamento asset e' completo e il primo frame e'
     stato disegnato (title.js chiama ctx.hideLoading(), game/src/app.js). */
  #loading { position: fixed; inset: 0; z-index: 10; background: #000;
             display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 18px;
             pointer-events: none; transition: opacity 0.6s ease; }
  #loading.hide { opacity: 0; }
  /* Animazione + "post processing" sul logo, richiesta dall'autore per
     rendere viva l'attesa invece del semplice fade statico di prima.
     `--logo-url` e' referenziato sia dall'<img> (via src) sia dagli
     "ghost" sotto (via mask-image): un solo file, riusato per la
     maschera invece che duplicato come asset. */
  :root { --logo-url: url("./assets/mount_logo.webp"); }
  .logoWrap { position: relative; width: min(45vw, 340px); }
  /* Alone rosso pulsante dietro al logo — la "cornice" di luce che un
     PNG statico non puo' avere da solo, z-index sotto l'immagine.
     Keyframe dedicato (`auraPulse`, non `fujiGlow`): quello anima
     `filter: drop-shadow(...)`, che SOSTITUISCE l'intero valore di
     `filter` invece di sommarsi al `blur(2px)` statico qui sotto — usarlo
     anche qui avrebbe fatto sparire la sfocatura appena l'animazione
     partiva (parte sempre subito, e' infinita). */
  .logoWrap::before {
    content: ""; position: absolute; inset: -30%; z-index: 0;
    background: radial-gradient(circle at 50% 55%, rgba(255,45,45,.4), rgba(255,45,45,0) 68%);
    filter: blur(2px); animation: auraPulse 3.6s ease-in-out infinite;
  }
  .logoWrap img {
    display: block; width: 100%; height: auto; position: relative; z-index: 1;
    opacity: 0; clip-path: circle(0px at 50% 50%);
    animation: fujiGlow 3.6s ease-in-out infinite;
  }
  /* Rivelazione "a timbro": un cerchio che si apre dal centro invece del
     semplice fade in opacita' — solo su #loading (primo avvio): la
     dissolvenza rapida di #levelLoading fra le room resta deliberatamente
     senza questa entrata (vedi il commento su #levelLoading piu' sotto). */
  #loading.show .logoWrap img {
    opacity: 1; clip-path: circle(75% at 50% 50%);
    transition: opacity 0.8s ease, clip-path 1.15s cubic-bezier(.22,.8,.25,1);
  }
  #levelLoading .logoWrap img { opacity: 1; clip-path: circle(75% at 50% 50%); }
  /* Sdoppiamento cromatico (ciano/blu) periodico: due sagome piene,
     ritagliate dall'alpha dello stesso PNG con `mask-image`, in
     `mix-blend-mode: screen` sopra sfondo nero — la stessa tecnica di uno
     split RGB da editing video, non un secondo asset. Restano invisibili
     (opacity 0) per quasi tutto il ciclo e si vedono solo per una frazione
     di secondo, come un artefatto di trasmissione. */
  .logoWrap .ghost {
    position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none;
    -webkit-mask-image: var(--logo-url); mask-image: var(--logo-url);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    mix-blend-mode: screen; animation: rgbGlitch 5.4s infinite;
  }
  .logoWrap .ghost.cyan { background: #00e5ff; }
  .logoWrap .ghost.blue { background: #4d5bff; animation-delay: .06s; }
  @keyframes fujiGlow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(255,45,45,.55)) drop-shadow(0 0 14px rgba(255,45,45,.22)); }
    50%      { filter: drop-shadow(0 0 16px rgba(255,45,45,.85)) drop-shadow(0 0 34px rgba(255,45,45,.4)); }
  }
  @keyframes auraPulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.08); }
  }
  @keyframes rgbGlitch {
    0%, 92%, 100% { opacity: 0; transform: translate(0, 0); }
    93% { opacity: .55; transform: translate(-3px, 0); }
    94% { opacity: .4;  transform: translate(2px, 1px); }
    95% { opacity: .55; transform: translate(-2px, -1px); }
    96% { opacity: 0;   transform: translate(0, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logoWrap::before, .logoWrap img, .logoWrap .ghost { animation: none; }
    .logoWrap .ghost { display: none; }
  }
  /* Scritta "loading" sotto il logo — piccola, bianca su nero, nello stesso
     stile della UI vera del gioco (font.js: un sans grottesco/geometrico,
     "Gotham" — mai monospace: il precedente `ui-monospace` non assomigliava
     per niente al font reale del gioco, solo alla stessa famiglia usata per
     l'HUD di debug). Resta comunque testo HTML vettoriale, non il font
     bitmap vero (font.js/drawText()): quell'atlas campiona con filtro
     NEAREST apposta per restare nitido (vedi il fix su loadFont(), font.js)
     ma e' comunque un asset da scaricare — proprio quello che questa
     schermata deve coprire MENTRE arriva, quindi non e' disponibile cosi'
     presto. */
  #loading span, #levelLoading span {
    font: 700 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.14em; color: #fff; text-transform: uppercase;
  }
  /* HUD di debug di main.js: nascosto di default (mostrato solo mentre e'
     montata una partita, game/src/app.js/mountMatch()) cosi' non lampeggia
     vuoto sul menu prima che lo script parta. */
  #hud { display: none; position: fixed; left: 8px; top: 56px;
         font: 12px/1.5 ui-monospace, monospace; color: #9fb4d8;
         pointer-events: none; white-space: pre; text-shadow: 0 1px 2px #000; }
  /* Schermata fra il tap su un livello nel menu e il primo frame disegnato
     da main.js — [Bug corretto, segnalato dall'autore: "sembra che il
     gioco si sia bloccato" cliccando un livello] `navigate()` (game/src/
     app.js) disegna gia' un frame nero pieno-schermo prima di aspettare
     fetch di scene/atlas/texture della room (puo' richiedere diversi
     secondi su rete lenta), ma un rettangolo nero senza nulla sopra e'
     indistinguibile da un blocco vero. Stesso logo Mount Fuji + scritta
     "loading" di #loading sopra (richiesto dall'autore: le due schermate
     di caricamento devono essere coerenti fra loro), non testo bitmap
     disegnato dal renderer WebGL (game/src/font.js): quel font e' un
     asset da scaricare, proprio quello che questo overlay deve coprire
     MENTRE arriva — non e' ancora disponibile cosi' presto. Overlay HTML
     vettoriale invece: nitido a qualunque dimensione, nessun asset da
     aspettare. Mostrato/nascosto da app.js/navigate(), non da una singola
     schermata: serve identico per ogni cambio room (match, match_easy,
     tutorial), non solo il primo avvio come #loading sopra — qui pero'
     senza la dissolvenza in entrata del logo (`show img`, sopra): un
     cambio room e' gia' un'attesa breve e frequente, non il primo impatto
     con l'app. */
  #levelLoading { position: fixed; inset: 0; z-index: 11; background: #000;
                  display: flex; flex-direction: column; align-items: center;
                  justify-content: center; gap: 18px;
                  pointer-events: none; opacity: 0; transition: opacity 0.25s ease; }
  #levelLoading.show { opacity: 1; }
</style>
<canvas id="view"></canvas>
<div id="loading">
  <div class="logoWrap">
    <img src="./assets/mount_logo.webp" alt="Mount Fuji Software">
    <div class="ghost cyan" aria-hidden="true"></div>
    <div class="ghost blue" aria-hidden="true"></div>
  </div>
  <span>loading</span>
</div>
<div id="levelLoading">
  <div class="logoWrap">
    <img src="./assets/mount_logo.webp" alt="Mount Fuji Software">
    <div class="ghost cyan" aria-hidden="true"></div>
    <div class="ghost blue" aria-hidden="true"></div>
  </div>
  <span>loading</span>
</div>
<div id="hud"></div>
<script type="module" src="./src/app.js"></script>
