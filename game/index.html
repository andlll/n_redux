<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Il gioco e' ancora in sviluppo attivo: il sito statico non deve
     "ricordarsi" una build precedente. Lo stato di gioco non persiste piu'
     da solo fra un caricamento e l'altro (game/src/main.js, seedChies()
     sempre), e questi header spingono anche il browser a non tenersi in
     cache l'HTML stesso invece di riservare la versione vecchia finche' la
     cache non scade da sola. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NIMBUS</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden;
               touch-action: none; overscroll-behavior: none; }
  #view { display: block; width: 100vw; height: 100vh; }
  /* Schermata di caricamento: sfondo nero pieno-schermo col logo Mount Fuji
     Software (tools/26_logo.py) centrato — STUDIO.md §3, il flusso di room
     originale e' `loguji` (logo Fuji) -> `title` (il menu) -> ...: lo splash
     precede il MENU, non i livelli. Il logo va in dissolvenza appena lo
     script parte (title.js aggiunge "show"); tutta l'overlay va in
     dissolvenza quando il caricamento asset e' completo e il primo frame e'
     stato disegnato (title.js chiama ctx.hideLoading(), game/src/app.js). */
  #loading { position: fixed; inset: 0; z-index: 10; background: #000;
             display: flex; align-items: center; justify-content: center;
             pointer-events: none; transition: opacity 0.6s ease; }
  #loading.hide { opacity: 0; }
  #loading img { width: min(45vw, 340px); height: auto; opacity: 0;
                 transition: opacity 0.8s ease; }
  #loading.show img { opacity: 1; }
  /* HUD di debug di main.js: nascosto di default (mostrato solo mentre e'
     montata una partita, game/src/app.js/mountMatch()) cosi' non lampeggia
     vuoto sul menu prima che lo script parta. */
  #hud { display: none; position: fixed; left: 8px; top: 56px;
         font: 12px/1.5 ui-monospace, monospace; color: #9fb4d8;
         pointer-events: none; white-space: pre; text-shadow: 0 1px 2px #000; }
  /* Scritta "loading" fra il tap su un livello nel menu e il primo frame
     disegnato da main.js — [Bug corretto, segnalato dall'autore: "sembra
     che il gioco si sia bloccato" cliccando un livello] `navigate()`
     (game/src/app.js) disegna gia' un frame nero pieno-schermo prima di
     aspettare fetch di scene/atlas/texture della room (puo' richiedere
     diversi secondi su rete lenta), ma un rettangolo nero senza alcun
     testo e' indistinguibile da un blocco vero. Overlay HTML, non testo
     bitmap disegnato dal renderer WebGL (game/src/font.js): quel font e'
     un'immagine ("atlas" di glifi) campionata con filtro LINEAR (STUDIO.md
     — necessario per lo sprite-work del gioco), quindi si sgranerebbe
     ingrandendola per farla leggibile da lontano — e i suoi stessi dati
     (font_*.json/png) sono fra le cose che questo overlay deve coprire
     MENTRE vengono ancora scaricate, quindi non e' nemmeno disponibile
     cosi' presto. Il testo di un elemento HTML e' invece vettoriale: la
     stessa nitidezza a qualunque dimensione, "pixel perfect" a costo
     zero — nessun asset da aspettare. `-webkit-font-smoothing:none` (con
     l'equivalente Firefox `moz-osx-font-smoothing`) toglie l'antialiasing
     sub-pixel del testo: bordi netti a scalino invece che sfumati, piu'
     coerente con la grafica a pixel del resto del gioco che un
     antialiasing morbido. Mostrato/nascosto da app.js/navigate(), non da
     una singola schermata: serve identico per ogni cambio room (match,
     match_easy, tutorial), non solo il primo avvio come #loading sopra. */
  #levelLoading { position: fixed; inset: 0; z-index: 11; background: #000;
                  display: flex; align-items: center; justify-content: center;
                  pointer-events: none; opacity: 0; transition: opacity 0.25s ease; }
  #levelLoading.show { opacity: 1; }
  #levelLoading span { font: 700 8vh/1 ui-monospace, "Courier New", monospace;
                        letter-spacing: 0.08em; color: #fff; text-transform: uppercase;
                        -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; }
</style>
<canvas id="view"></canvas>
<div id="loading"><img src="./assets/mount_logo.png" alt="Mount Fuji Software"></div>
<div id="levelLoading"><span>loading</span></div>
<div id="hud"></div>
<script type="module" src="./src/app.js"></script>
