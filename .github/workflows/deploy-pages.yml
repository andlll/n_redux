name: Deploy static site

# Il repo versiona solo la fonte (dati, texture originali, codice del motore).
# Gli atlas per room (game/assets/*.webp, PNG fino a STUDIO.md "da PNG a
# WebP") sono derivati e volutamente non versionati: questa pipeline li
# rigenera ad ogni deploy e pubblica game/ cosi' com'e' come sito statico,
# senza nessun passo lato server a runtime.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa Pillow
        run: pip install pillow

      - name: Rigenera gli atlas per room
        run: |
          for room in match_easy match title tutorial; do
            python3 tools/23_atlas.py "$room"
            python3 tools/24_blit.py "$room"
          done

      - name: Rigenera i font bitmap della UI
        run: |
          for font in gotham_mid gotham_mini gotham_mobile; do
            python3 tools/25_font.py "$font"
            python3 tools/24_blit.py "font_$font"
          done

      - name: Rigenera il logo della schermata di caricamento
        run: |
          python3 tools/26_logo.py mount_logo
          python3 tools/24_blit.py mount_logo

      # Bundle JS minificato (STUDIO.md, "da PNG a WebP" + il seguito su JS):
      # index.html carica ./dist/app.js, mai versionato (come game/assets/
      # sopra) — senza questo passo il sito pubblicato avrebbe un <script>
      # che punta a un file inesistente.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Installa le dipendenze di build (esbuild)
        working-directory: game
        run: npm ci

      - name: Bundle + minifica il JS del motore
        working-directory: game
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
