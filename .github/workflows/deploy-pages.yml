name: Deploy static site

# Il repo versiona solo la fonte (dati, texture originali, codice del motore).
# Gli atlas per room (game/assets/*.png) sono derivati e volutamente non
# versionati: questa pipeline li rigenera ad ogni deploy e pubblica game/
# cosi' com'e' come sito statico, senza nessun passo lato server a runtime.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa Pillow
        run: pip install pillow

      - name: Rigenera gli atlas per room
        run: |
          for room in match_easy match title tutorial; do
            python3 tools/23_atlas.py "$room"
            python3 tools/24_blit.py "$room"
          done

      - name: Rigenera i font bitmap della UI
        run: |
          for font in gotham_mid gotham_mini; do
            python3 tools/25_font.py "$font"
            python3 tools/24_blit.py "font_$font"
          done

      - name: Rigenera il logo della schermata di caricamento
        run: |
          python3 tools/26_logo.py mount_logo
          python3 tools/24_blit.py mount_logo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
